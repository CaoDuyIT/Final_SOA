<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Housekeeping Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Housekeeping</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#" class="active">Rooms to Clean</a></li>
                    <li><a href="index.html">Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1>Rooms to Clean</h1>
            </header>
            <div class="content">
                <table id="rooms-to-clean-table">
                    <thead>
                        <tr>
                            <th>Room Number</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>102</td>
                            <td class="status">Needs Cleaning</td>
                            <td class="actions">
                                <button class="btn edit-btn">Mark as In Progress</button>
                            </td>
                        </tr>
                        <tr>
                            <td>301</td>
                            <td class="status">Needs Cleaning</td>
                            <td class="actions">
                                <button class="btn edit-btn">Mark as In Progress</button>
                            </td>
                        </tr>
                         <tr>
                            <td>205</td>
                            <td class="status">In Progress</td>
                            <td class="actions">
                                <button class="btn action-btn">Mark as Available</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="js/housekeeping.js"></script>
</body>
</html>
