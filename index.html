<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <header>
        <h1>Hotel Management System</h1>
        <nav>
            <ul>
                <li><a href="#rooms">Rooms</a></li>
                <li><a href="history.html">My Bookings</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="search-filter">
            <h2>Find Your Perfect Room</h2>
            <form id="search-form">
                <div class="form-group">
                    <label for="check-in">Check-in Date</label>
                    <input type="date" id="check-in" name="check-in">
                </div>
                <div class="form-group">
                    <label for="check-out">Check-out Date</label>
                    <input type="date" id="check-out" name="check-out">
                </div>
                <div class="form-group">
                    <label for="guests">Guests</label>
                    <input type="number" id="guests" name="guests" min="1" placeholder="Any">
                </div>
                <div class="form-group">
                    <label for="room-type">Room Type</label>
                    <select id="room-type" name="room-type">
                        <option value="">All</option>
                        <option value="Single">Single</option>
                        <option value="Double">Double</option>
                        <option value="Suite">Suite</option>
                    </select>
                </div>
                 <div class="form-group">
                    <label for="max-price">Max Price</label>
                    <input type="range" id="max-price" name="max-price" min="50" max="500" value="500" step="10">
                    <span id="price-display">$500</span>
                </div>
                <div class="form-group">
                    <button type="submit" class="search-btn">Search Rooms</button>
                </div>
            </form>
        </section>

        <section id="rooms">
            <h2>Available Rooms</h2>
            <div id="room-list" class="room-list">
                <!-- Room cards will be dynamically inserted here by JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Hotel Management System</p>
    </footer>

    <!-- Room Detail/Booking Modal -->
    <div id="booking-modal" class="modal-container">
        <div class="modal-overlay">
            <div class="modal-content" style="max-width: 600px;">
                <div class="modal-header">
                    <h2 id="booking-modal-title">Room Details</h2>
                    <button class="close-btn">&times;</button>
                </div>
                <div id="booking-modal-body" class="modal-body">
                    <!-- Dynamic content will be injected here -->
                </div>
                <div class="modal-footer">
                    <button id="payment-btn" class="btn btn-primary">Proceed to Payment</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal-container">
        <div class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Online Payment</h2>
                    <button class="close-btn">&times;</button>
                </div>
                <form id="payment-form">
                    <div class="modal-body">
                        <p>Total Amount: <span id="total-amount">$200</span> (for 2 nights)</p>
                        <div class="form-group">
                            <label for="payment-method">Payment Method</label>
                            <select id="payment-method">
                                <option>E-wallet</option>
                                <option>Bank Transfer</option>
                                <option>Credit Card</option>
                            </select>
                        </div>
                         <div class="form-group">
                            <label for="otp">Enter OTP</label>
                            <input type="text" id="otp" placeholder="Check your email for OTP" required>
                        </div>
                        <p><a href="#">Resend OTP</a></p>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Confirm Payment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/guest.js"></script>
</body>
</html>
