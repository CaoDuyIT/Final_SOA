<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Hotel Management</title>
    <link rel="stylesheet" href="css/login.css"> <!-- Reusing login styles for consistency -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input id="signup-username" type="text" placeholder="Username" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input id="signup-fullname" type="text" placeholder="Full Name" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input id="signup-email" type="email" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input id="signup-phone" type="text" placeholder="Phone" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input id="signup-password" type="password" placeholder="Password" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input id="signup-password-checker" type="password" placeholder="Confirm Password" required>
                </div>

                <button type="submit" class="login-btn">SIGN UP</button>

                <div class="signup-link">
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
<script src="js/login_signup.js"></script>
</html>
