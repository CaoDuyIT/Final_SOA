<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/receptionist.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Reception</h2>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#" id="nav-checkin-checkout" class="active">Check-in / Check-out</a></li>
                    <!-- <li><a href="#" id="nav-bookings">All Bookings</a></li> -->
                    <!-- <li><a href="#" id="nav-report">Report Issue</a></li> -->
                    <li><a href="index.html">Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <!-- Check-in / Check-out Section -->
            <div id="checkin-checkout-content" class="content-block">
                <header class="main-header">
                    <h1>Guest Search</h1>
                </header>
                <div class="content">
                    <form id="search-booking-form" class="search-bar">
                        <input type="text" id="search-input" placeholder="Search by Booking ID, Name, or Phone...">
                        <button type="button" id="reset-search-btn" class="action-btn" style="background-color: #28a745; margin-right: 10px;">Reset</button>
                        <button type="submit" class="action-btn">Search</button>
                    </form>
                    <div id="search-results" class="search-results-container">
                        <!-- Search results will be displayed here -->
                    </div>
                </div>
            </div>

            <!-- All Bookings Section (Hidden) -->
            <!-- <div id="bookings-content" class="content-block" style="display: none;"> ... </div> -->

            <!-- Report Issue Section (Hidden) -->
            <!-- <div id="report-content" class="content-block" style="display: none;"> ... </div> -->
        </main>
    </div>
    <script src="js/receptionist.js"></script>
</body>
</html>
