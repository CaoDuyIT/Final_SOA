<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Hotel Management</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>My Account</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#" class="active">Booking History</a></li>
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1>Booking History</h1>
            </header>
            <div class="content">
                <table>
                    <thead>
                        <tr>
                            <th>Booking ID</th>
                            <th>Dates</th>
                            <th>Room</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>BK-12345</td>
                            <td>2025-12-10 to 2025-12-12</td>
                            <td>Deluxe Double Room</td>
                            <td>Completed</td>
                            <td class="actions">
                                <button class="btn edit-btn review-btn">Leave a Review</button>
                            </td>
                        </tr>
                        <tr>
                            <td>BK-67890</td>
                            <td>2026-01-05 to 2026-01-08</td>
                            <td>Family Suite</td>
                            <td>Confirmed</td>
                            <td class="actions">
                                <!-- No action for upcoming stays -->
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Review Modal -->
    <div id="review-modal" class="modal-container">
        <div class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Leave a Review</h2>
                    <button class="close-btn">&times;</button>
                </div>
                <form id="review-form">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="rating">Rating (1-5)</label>
                            <input type="number" id="rating" min="1" max="5" required>
                        </div>
                        <div class="form-group">
                            <label for="review-text">Your Experience</label>
                            <textarea id="review-text" rows="4" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Submit Review</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/history.js"></script>
</body>
</html>
