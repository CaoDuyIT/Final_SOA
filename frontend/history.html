<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Hotel Management</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>My Account</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#" class="active">Booking History</a></li>
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1>Booking History</h1>
            </header>
            <div class="content">
                <table>
                    <thead>
                        <tr>
                            <th>Dates</th>
                            <th>Room</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Overlay -->
    <div id="review-overlay" class="modal-overlay"></div>

    <!-- Review Modal -->
    <div id="review-modal" class="modal-content" style="display: none;">
        <div class="modal-header">
            <h2>Write a Review</h2>
            <button class="close-btn" id="close-review">&times;</button>
        </div>

        <form id="review-form">
            <div class="modal-body">

                <!-- Rating Stars -->
                <div class="form-group rating-group">
                    <label>Rating</label>
                    <div class="stars">
                        <i class="star" data-value="1">&#9733;</i>
                        <i class="star" data-value="2">&#9733;</i>
                        <i class="star" data-value="3">&#9733;</i>
                        <i class="star" data-value="4">&#9733;</i>
                        <i class="star" data-value="5">&#9733;</i>
                    </div>
                    <input type="hidden" id="rating" required>
                </div>

                <!-- Review Text -->
                <div class="form-group">
                    <label for="review-text">Your Experience</label>
                    <textarea id="review-text" rows="3" required></textarea>
                </div>

                <!-- Optional Issue Report -->
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="report-check">
                        Báo cáo sự cố (optional)
                    </label>
                </div>

                <div class="form-group" id="issue-box" style="display: none;">
                    <label for="issue-text">Mô tả sự cố</label>
                    <textarea id="issue-text" rows="2" placeholder="Ví dụ: Điều hòa hỏng, nước bị rò..." ></textarea>
                </div>

            </div>

            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Submit Review</button>
            </div>
        </form>
    </div>

    <!-- Issue Modal -->
    <div id="issue-overlay" class="modal-overlay"></div>

    <div id="issue-modal" class="modal-content" style="display:none;">
        <div class="modal-header">
            <h2>Report an Issue</h2>
            <button class="close-btn" id="close-issue">&times;</button>
        </div>

        <form id="issue-form">
            <div class="modal-body">
                <div class="form-group">
                    <label for="issue-text">Describe the issue</label>
                    <textarea id="issue-text" rows="3" placeholder="Ví dụ: Máy lạnh không hoạt động..." required></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button type="submit" class="btn btn-danger">Submit Report</button>
            </div>
        </form>
    </div>

    <script src="js/history.js"></script>
</body>
</html>
